# ==============================================================================
# Конфигурация агента McpAgent
# ==============================================================================
# Автоматически создан с помощью: bundle exec mcp_agent init
# ==============================================================================

agent:
  name: my_agent              # Измените на имя вашего агента
  version: 1.0.0              # Версия вашего агента
  log_level: INFO             # DEBUG, INFO, WARN, ERROR

# ==============================================================================
# MCP Server Configuration
# ==============================================================================
# URL вашего MCP сервера для получения данных и инструментов
mcp:
  url: https://your-mcp-server.com/mcp

# ==============================================================================
# AI Configuration
# ==============================================================================
# Настройки AI модели для обработки запросов
ai:
  model: gpt-4.1-mini         # Модель OpenAI (gpt-4.1-mini, gpt-4, gpt-3.5-turbo)

# ==============================================================================
# Transports Configuration
# ==============================================================================
# Транспорты для взаимодействия с пользователями и другими агентами
transports:
  rabbitmq:
    enabled: true             # Включить RabbitMQ транспорт (в разработке)
    host: localhost
    port: 5672

# ==============================================================================
# Processing Configuration
# ==============================================================================
# System prompt определяет роль и поведение вашего агента
processing:
  system_prompt: |
    Ты - интеллектуальный помощник.
    Твоя задача - помогать пользователям с их запросами.
    Используй предоставленный контекст из MCP инструментов для формирования точных ответов.
    
    Отвечай на русском языке, будь вежлив и конкретен.

